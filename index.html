<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería JEOM</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <img src="./img/UTTT.png" alt="Logo">
        <h1>Galería de imágenes</h1>
    </header>
    <main id="contenedor">
    </main>
    <footer>
        <button id="btn_color">Cambiar colores</button>
    </footer>
    <script src="./function.js"></script>

    <div class="tarjeta JEOM-Squirtul">
    <h2>Squirtul</h2>
    <img src="./img/imagen_1.webp" alt="Squirtul">
    <p>Es una tortuga.</p>
</div>
<div class="tarjeta JEOM-Pikachu">
    <h2>Pikachu</h2>
    <img src="./img/imagen_2.webp" alt="Pikachu">
    <p>Es una rata.</p>
</div>
<div class="tarjeta JEOM-Charmander">
    <h2>Charmander </h2>
    <img src="./img/imagen_3.png" alt="Charmander">
    <p>Es un lagarto.</p>
</div>
<div class="tarjeta JEOM-Bolvasur">
    <h2>Bolvasur</h2>
    <img src="./img/imagen_4.png" alt="Bolvasur">
    <p>Es una rana.</p>
</div>
<div class="tarjeta JEOM-Eevee">
    <h2>Eevee</h2>
    <img src="./img/imagen_5.png" alt="Eevee">
    <p>Es un Pokémon de tipo normal.</p>
</div>
<div class="tarjeta JEOM-Mew">
    <h2>Mew</h2>
    <img src="./img/imagen_6.png" alt="Mew">
    <p>Es un Pokémon legendario.</p>
</div>
<div class="tarjeta JEOM-Zamacenta">
    <h2>Zamacenta</h2>
    <img src="./img/imagen_7.png" alt="Zamacenta">
    <p>Es un Pokémon de tipo tierra.</p>
</div>
<div class="tarjeta JEOM-Lucario">
    <h2>Lucario</h2>
    <img src="./img/imagen_8.png" alt="Lucario">
    <p>Es un Pokémon de tipo lucha y acero.</p>
</div>
</body>
</html>
